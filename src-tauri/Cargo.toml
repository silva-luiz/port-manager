[package]
name = "port-manager"
version = "0.2.0"
description = "Desktop utility to inspect and manage local network ports and processes"
authors = ["Luiz"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows (rust-lang/cargo#8519).
name = "port_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
tauri-plugin-window-state = "2.5.0"
tauri-plugin-notification = "2.8.1"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-log = "2.10.2"
log = "0.4.35"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_System_Threading", "Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
