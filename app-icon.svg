<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Source for all app icons: `npm run tauri icon app-icon.svg` -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="#1a1f28"/>
  <rect x="72" y="72" width="880" height="880" rx="200" fill="none" stroke="#2c3442" stroke-width="16"/>

  <!-- Network port (RJ45 jack seen from the front) -->
  <path d="M256 336 H768 V672 H640 V752 H384 V672 H256 Z"
        fill="#212733" stroke="#7aa7f0" stroke-width="56" stroke-linejoin="round"/>
  <g fill="#7aa7f0">
    <rect x="370" y="400" width="44" height="120" rx="12"/>
    <rect x="450" y="400" width="44" height="120" rx="12"/>
    <rect x="530" y="400" width="44" height="120" rx="12"/>
    <rect x="610" y="400" width="44" height="120" rx="12"/>
  </g>

  <!-- "Listening" status light -->
  <circle cx="780" cy="244" r="76" fill="#1a1f28"/>
  <circle cx="780" cy="244" r="56" fill="#5fbf8a"/>
</svg>
